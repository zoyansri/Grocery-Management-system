<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandages Machine</title>
  <link rel="stylesheet" href="machine.css">
</head>
<body>
  <div id="head">
    <h2 id="name">Bandages</h2>
    <input type="hidden" id="machineID" value="M01">
    <input type="hidden" id="productID" value="P01">
  </div>

  <div class="form">
    <input type="text" id="uniqueID" placeholder="Enter ID">
    <button id="decrement">-</button>
    <input type="number" id="qty" value="0">
    <button id="increment">+</button>
    <button id="give">Withdraw</button>
    <button id="reset">Reset</button>

    <!-- Digit buttons -->
    <div class="digits">
      <button class="digit">1</button>
      <button class="digit">2</button>
      <button class="digit">3</button>
      <button class="digit">4</button>
      <button class="digit">5</button>
      <button class="digit">6</button>
      <button class="digit">7</button>
      <button class="digit">8</button>
      <button class="digit">9</button>
      <button class="digit">0</button>
    </div>
  </div>

  <div class="summary" style="display:none;">
    <p>Item: <span id="displayName"></span></p>
    <p>Qty: <span id="displayQty"></span></p>
    <p>ID: <span id="displayID"></span></p>
  </div>

  <script src="machine.js"></script>
</body>
</html>
